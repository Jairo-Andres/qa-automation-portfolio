name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # cada lunes, para detectar cambios en las webs de demo

jobs:
  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar tests de UI
        run: pytest

      - name: Subir reporte y trazas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: |
            reports/
            test-results/

  api-tests:
    name: API tests (Postman + Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Newman
        run: npm ci

      - name: Ejecutar colección de Postman
        run: npm run test:api

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/
