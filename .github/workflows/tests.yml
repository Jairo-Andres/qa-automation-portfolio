name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # cada lunes, para detectar cambios en las webs de demo

jobs:
  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar tests de UI
        run: pytest

      - name: Resumen de resultados
        if: always()
        run: python scripts/test_summary.py "🖥️ UI tests (Playwright)" reports/ui-junit.xml

      - name: Subir reporte y trazas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-report
          path: |
            reports/
            test-results/

  api-tests:
    name: API tests (Postman + Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Instalar Newman
        run: npm ci

      # restful-booker se reinicia periódicamente y borra tokens y reservas.
      # Si el reinicio coincide con la ejecución, se reintenta una vez.
      - name: Ejecutar colección de Postman
        run: |
          npm run test:api || {
            echo "::warning::La colección falló; reintentando por si restful-booker se reinició durante la ejecución"
            sleep 20
            npm run test:api
          }

      - name: Resumen de resultados
        if: always()
        run: python3 scripts/test_summary.py "🔌 API tests (Postman + Newman)" reports/api-junit.xml

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-report
          path: reports/
